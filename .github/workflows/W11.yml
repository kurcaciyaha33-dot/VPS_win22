
name: Windows 11 Arm by Redzz

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Credentials
        shell: pwsh
        run: |
          $password = "${{ secrets.RDP_PASS }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "RDP_PASS secret belum dikonfigurasi."
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "Redzz" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "Redzz"
          }

          New-LocalUser -Name "Redzz" -Password $securePass -AccountNeverExpires -Description "Tailscale RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member "Redzz"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Redzz"

          if (-not (Get-LocalUser -Name "Redzz")) {
              throw "Gagal membuat user baru."
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-arm64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale ARM64..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Write-Host "Installing Tailscale..."
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait -PassThru

          Remove-Item $installerPath -Force

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed. Exit code: $($process.ExitCode)"
          }

          Start-Sleep -Seconds 5

          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsPath)) {
              throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed successfully."
          & $tsPath version



      - name: Tailscale Authentication (Auth Key)
        shell: pwsh
        timeout-minutes: 2
        env:
          TS_AKEY: ${{ secrets.TS_AKEY }}
        run: |
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TS_AKEY)) {
              throw "GitHub Secret TS_AKEY belum dikonfigurasi."
          }

          Write-Host "=========================================="
          Write-Host "       TAILSCALE KEY AUTHENTICATION"
          Write-Host "=========================================="

          Write-Host "Connecting to Tailscale..."

          & $tsPath up `
              "--auth-key=$env:TS_AKEY" `
              "--hostname=gh-windows-arm-${{ github.run_id }}" `
              "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication failed. Exit code: $LASTEXITCODE"
          }

          Start-Sleep -Seconds 3

          $tsIP = & $tsPath ip -4 2>$null | Select-Object -First 1

          if (-not $tsIP) {
              throw "Tailscale IP address not found."
          }

          "TAILSCALE_IP=$tsIP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "=========================================="
          Write-Host "       TAILSCALE CONNECTED"
          Write-Host "=========================================="
          Write-Host "Tailscale IP: $tsIP"


      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ip = $env:TAILSCALE_IP

          if (-not $ip) {
              throw "TAILSCALE_IP tidak ditemukan."
          }

          $testResult = Test-NetConnection -ComputerName $ip -Port 3389 -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              throw "Koneksi RDP internal via Port 3389 gagal!"
          }

          Write-Host "RDP connectivity verified."

      - name: Maintain Connection
        shell: pwsh
        run: |
          $ip = $env:TAILSCALE_IP

          Write-Host "`n========================================"
          Write-Host "       KONEKSI RDP BERHASIL AKTIF"
          Write-Host "========================================"
          Write-Host "IP Address : $ip"
          Write-Host "Username   : Redzz"
          Write-Host "Password   : Disimpan secara rahasia"
          Write-Host "========================================"

          Write-Host "Gunakan aplikasi Remote Desktop (RDP)."
          Write-Host "Tekan Cancel pada Workflow GitHub untuk berhenti."

          while ($true) {
              Write-Host "[$(Get-Date)] Runner Tetap Aktif..."
              Start-Sleep -Seconds 180
          }
